name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: "src"

      - name: Prepare builds worktree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src"
          if ! git fetch origin builds:builds 2> /dev/null; then
            git branch builds
          fi
          git worktree add "$GITHUB_WORKSPACE/builds" builds
          git -C "$GITHUB_WORKSPACE/builds" rm -rf --quiet . || true

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          (cd "$SDK_ROOT/cmdline-tools" && jar xf /tmp/cmdline-tools.zip)
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          chmod +x "$SDK_ROOT"/cmdline-tools/latest/bin/* 2>/dev/null || true
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Plugins
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties
          chmod +x gradlew
          ./gradlew make makePluginsJson
          find . -path "*/build/*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          find . -name "plugins.json" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp repo.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [ -n "$(git status -s)" ]; then
            git commit -m "Build $GITHUB_SHA"
            git push --force origin builds
          else
            echo "No changes to push"
          fi
